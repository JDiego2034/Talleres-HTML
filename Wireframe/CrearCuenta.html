<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/CrearCuenta.css">
    <title>WireFrame - Crear Cuenta</title>
</head>

<body>

    <header>
        <nav>
            <strong>WireFrame</strong>
            &nbsp;&nbsp;&nbsp;
            <a href="index.html">Página Principal</a>
        </nav>
    </header>

    <main>

        <section>

            <h1>Crear una Cuenta</h1>

            <p>
                Regístrate para comenzar a utilizar WireFrame.
            </p>

            <form action="#" method="post">

                <p>
                    <label for="nombre"><strong>Nombre Completo</strong></label><br>
                    <input type="text" id="nombre" name="nombre"
                           placeholder="Ingresa tu nombre" required>
                </p>

                <p>
                    <label for="email"><strong>Correo Electrónico</strong></label><br>
                    <input type="email" id="email" name="email"
                           placeholder="ejemplo@correo.com" required>
                </p>

                <p>
                    <label for="password"><strong>Contraseña</strong></label><br>
                    <input type="password" id="password" name="password"
                           placeholder="Ingresa tu contraseña" required>
                </p>

                <p>
                    <label for="rol"><strong>Tipo de Cuenta</strong></label><br>
                    <select id="rol" name="rol">
                        <option value="creador">Creador de Contenido</option>
                        <option value="editor">Editor</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </p>

                <p>
                    <button type="submit">
                        Crear Cuenta
                    </button>
                </p>

            </form>

            <hr>

            <p>
                ¿Ya tienes una cuenta?
                <a href="index.html">Iniciar Sesión</a>
            </p>

        </section>

    </main>

    <footer>
        <p>
            WireFrame &copy; 2026. Todos los derechos reservados.
        </p>
    </footer>

</body>
</html>
