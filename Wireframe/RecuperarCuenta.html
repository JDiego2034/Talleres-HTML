<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/RecuperarCuenta.css">
    <title>WireFrame - Recuperar Contraseña</title>
</head>

<body>

<header class="Header-RecuperarCuenta">
    <nav>
        <strong>WireFrame</strong>
        &nbsp;&nbsp;&nbsp;
        <a href="./index.html">
            Inicio de Sesión
        </a>
    </nav>
</header>

<main>

    <section>

        <h1>¿Olvidaste tu contraseña?</h1>

        <p>
            No te preocupes. Ingresa tu correo electrónico
            y te ayudaremos a recuperar el acceso a tu cuenta.
        </p>

        <form action="#" method="post">

            <p>
                <label for="email"><strong>Correo Electrónico</strong></label><br>
                <input type="email" id="email" name="email"
                       placeholder="ejemplo@correo.com" required>
            </p>

            <p>
                <button type="submit">
                    Recuperar Contraseña
                </button>
            </p>

        </form>

        <hr>

        <p>
            <a href="./index.html">
                Volver al inicio de sesión
            </a>
        </p>

    </section>

</main>

<footer class="Footer-RecuperarCuenta">
    <p>WireFrame &copy; 2026.</p>
</footer>

</body>
</html>
