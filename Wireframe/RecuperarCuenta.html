<!DOCTYPE html>

<html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>WireFrame - Recuperar Contraseña</title> </head>

<body style="font-family: 'Trebuchet MS', Arial; margin: 15px; background-color: #f5f7fa;">

<header style="border: 1px solid #aaa; background-color: white; padding: 15px; margin-bottom: 15px;">
    <nav>
        <strong style="color: #315f8c;">WireFrame</strong>
        &nbsp;&nbsp;&nbsp;
        <a href="./index.html" style="color: #315f8c;">
            Inicio de Sesión
        </a>
    </nav>
</header>

<main style="text-align: center;">

    <section style="display: inline-block; width: 45%; min-width: 300px; border: 1px solid #aaa; background-color: white; padding: 25px;">

        <h1 style="color: #315f8c;">¿Olvidaste tu contraseña?</h1>

        <p>
            No te preocupes. Ingresa tu correo electrónico
            y te ayudaremos a recuperar el acceso a tu cuenta.
        </p>

        <form action="#" method="post">

            <p>
                <label for="email"><strong>Correo Electrónico</strong></label><br>
                <input type="email" id="email" name="email"
                       placeholder="ejemplo@correo.com" required>
            </p>

            <p>
                <button type="submit"
                        style="background-color: #315f8c; color: white; padding: 9px 20px; border: 0;">
                    Recuperar Contraseña
                </button>
            </p>

        </form>

        <hr>

        <p>
            <a href="./index.html" style="color: #315f8c;">
                Volver al inicio de sesión
            </a>
        </p>

    </section>

</main>

<footer style="border: 1px solid #aaa; background-color: white; margin-top: 15px; padding: 12px; text-align: center;">
    <p>WireFrame &copy; 2026.</p>
</footer>

</body> 
</html>
